<style>
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --surface2:#EAF0EA; --ink:#15211B; --muted:#5A6860; --line:#D5DDD6;
  --green:#0B5D45; --green-soft:#DCEDE4; --red:#C23A2F; --red-soft:#F8E1DD; --gold:#B7791F;
  --ok:#1D7A4E; --ok-soft:#DDF1E5; --bad:#B3362B; --bad-soft:#F7E0DC;
  --bubbleA:#FFFFFF; --bubbleB:#0B5D45; --bubbleBInk:#F2FAF5;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --bn:"Hind Siliguri", "Noto Sans Bengali", "Vrinda", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1512; --surface:#16201B; --surface2:#1C2923; --ink:#E4ECE7; --muted:#99A89F; --line:#2B3A33;
    --green:#5CC49B; --green-soft:#1B3A2E; --red:#EE7266; --red-soft:#3A1F1C; --gold:#E0A84E;
    --ok:#5CC49B; --ok-soft:#173828; --bad:#F08579; --bad-soft:#3C1F1B;
    --bubbleA:#1C2923; --bubbleB:#1F5A45; --bubbleBInk:#EAF6EF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1512; --surface:#16201B; --surface2:#1C2923; --ink:#E4ECE7; --muted:#99A89F; --line:#2B3A33;
  --green:#5CC49B; --green-soft:#1B3A2E; --red:#EE7266; --red-soft:#3A1F1C; --gold:#E0A84E;
  --ok:#5CC49B; --ok-soft:#173828; --bad:#F08579; --bad-soft:#3C1F1B;
  --bubbleA:#1C2923; --bubbleB:#1F5A45; --bubbleBInk:#EAF6EF;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 64px}
.wrap{max-width:880px;margin:0 auto}
.bn{font-family:var(--bn);font-weight:500}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.card:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.hidebn .bn-only{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--bn);font-weight:500;font-size:14px;color:var(--muted)}
.spacer{flex:1}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 6px;font-size:14px}
.toggle .knob{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.toggle .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .2s}
.toggle[aria-pressed="true"] .knob{background:var(--green)}
.toggle[aria-pressed="true"] .knob::after{transform:translateX(14px)}

/* home */
.hero{padding-block:36px 20px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700}
.hero h1{font-size:clamp(32px,6vw,52px);font-weight:800;line-height:1.05;margin-top:8px}
.hero h1 span{color:var(--green)}
.hero p{max-width:60ch;color:var(--muted);margin:12px 0 0}
.how{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.how span{font-size:13px;background:var(--surface2);border-radius:6px;padding:4px 10px;color:var(--ink)}
.progress{margin-top:22px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.pbar{flex:1;max-width:260px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.level{margin-top:34px}
.levelhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.levelhead h2{font-size:22px;font-weight:700}
.levelhead .lv{font-family:var(--display);font-weight:800;color:var(--surface);background:var(--green);border-radius:6px;padding:2px 9px;font-size:14px}
.levelhead .bn{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--green);transform:translateY(-2px)}
.card .num{font-family:var(--display);font-weight:700;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.card .done{color:var(--ok)}
.card h3{font-size:19px;font-weight:700}
.card .bn{color:var(--muted);font-size:15px}
.card .scene{font-size:14px;color:var(--muted);margin-top:4px}

/* topic */
.thead{padding-block:22px 6px}
.thead h1{font-size:clamp(26px,5vw,38px);font-weight:800}
.thead .bn{font-size:18px;color:var(--muted);margin-top:2px}
.back{border:none;background:none;padding:6px 0;color:var(--green);font-weight:700;display:inline-flex;gap:6px;align-items:center}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-block:16px 22px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;font-weight:700}
.steps button small{font-family:var(--bn);font-weight:500;color:var(--muted);font-size:12px}
.steps button[aria-current="step"]{background:var(--green);border-color:var(--green);color:var(--surface)}
.steps button[aria-current="step"] small{color:var(--surface);opacity:.85}
.steps button .n{font-family:var(--display);font-size:12px;opacity:.7}

.panel{display:flex;flex-direction:column;gap:18px}
.section-title{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.section-title .bn{text-transform:none;letter-spacing:0;font-size:14px}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.word{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.word b{display:block;font-size:17px}
.word .bn{color:var(--green);font-size:15px}
.spk{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:inline-grid;place-items:center;color:var(--green)}
.spk svg{width:16px;height:16px}
.notts .spk{display:none}
.rep{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.reps{display:inline-flex;gap:4px;flex-wrap:wrap}
.rx{min-width:38px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);padding:0 8px}
.rx:hover{border-color:var(--green);color:var(--green)}
.rx.on,.spk.on{background:var(--green);border-color:var(--green);color:var(--surface)}
.msg.b .rx{background:transparent;border-color:rgba(255,255,255,.35);color:var(--bubbleBInk)}
.msg.b .rx.on,.msg.b .spk.on{background:var(--bubbleBInk);border-color:var(--bubbleBInk);color:var(--bubbleB)}
.bctl{margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:10px 14px}
.pattern .pr{grid-column:1/-1}

.patterns{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pattern{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.pattern:first-child{border-top:none}
.pattern .en{font-weight:700}
.pattern .en em{font-style:normal;color:var(--red);border-bottom:2px dotted var(--red)}
.pattern .bn{color:var(--muted)}
.hidebn .pattern{grid-template-columns:1fr}
.mistake{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mistake div{border-radius:10px;padding:12px 14px}
.mistake .w{background:var(--bad-soft)}
.mistake .r{background:var(--ok-soft)}
.mistake small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.mistake .w small{color:var(--bad)} .mistake .r small{color:var(--ok)}
.mistake .w span{text-decoration:line-through;text-decoration-color:var(--bad)}
.mistake p{grid-column:1/-1;margin:0;color:var(--muted);font-size:15px}

.scenebox{background:var(--surface2);border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.scenebox .tag{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);padding-top:3px;flex:none}
.scenebox p{margin:0}
.scenebox .bn{color:var(--muted);font-size:15px}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.chat{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 14px;min-height:120px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.msg:last-child{animation:pop .28s ease-out}
.msg.b{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;background:var(--red-soft);color:var(--red)}
.msg.b .av{background:var(--green-soft);color:var(--green)}
.bubble{background:var(--bubbleA);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;display:flex;flex-direction:column;gap:3px}
.msg.b .bubble{background:var(--bubbleB);color:var(--bubbleBInk);border-color:transparent;border-radius:16px 16px 4px 16px}
.bubble .who{font-size:12px;font-weight:700;opacity:.7}
.bubble .en{font-size:17px}
.bubble .bn{font-size:15px;opacity:.78}
.bubble .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.msg.b .spk{background:transparent;border-color:rgba(255,255,255,.35);color:var(--bubbleBInk)}
.rp-prompt{font-size:13px;font-weight:700;opacity:.8}
.reveal{margin-top:4px;align-self:flex-start;border:1px dashed currentColor;background:transparent;border-radius:8px;padding:5px 10px;font-size:14px;font-weight:700}
.chatctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:default}
.counter{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes pop{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.msg{animation:none}.card,.pbar i{transition:none}}

.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q .said{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q .said .en{font-size:17px;font-weight:700}
.q .said small{display:block;color:var(--muted);font-size:13px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;font-size:16px;display:flex;justify-content:space-between;gap:10px}
.opt:hover:not([disabled]){border-color:var(--green)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.opt[disabled]{cursor:default}
.opt .mark{font-weight:700}
.opt.right .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}
.score{font-family:var(--display);font-weight:700;font-size:18px}

.sp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sp .qq{font-size:18px;font-weight:700}
.sp .bn{color:var(--muted)}
.sp .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.timer{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;color:var(--green);min-width:3ch}
.timer.low{color:var(--red)}
.sample{background:var(--surface2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sample small{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.helpers{display:flex;flex-wrap:wrap;gap:6px}
.helpers span{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--muted)}

.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.finish{background:var(--green-soft);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.finish p{margin:0;flex:1;min-width:200px}
footer{margin-top:48px;font-size:13px;color:var(--muted)}

@media (max-width:560px){
  .steps button{font-size:12px;padding:8px 2px}
  .steps button small{display:none}
  .pattern,.mistake{grid-template-columns:1fr}
  .msg{max-width:96%}
  .brand small{display:none}
}
</style>

let player = null, rep = null;
const GAP = 700;
const stripTags = s => String(s).replace(/<[^>]+>/g,"");
function stopAll(){
  if(rep && rep.timer) clearTimeout(rep.timer);
  rep = null;
  try{ if(player){ player.onended=null; player.pause(); } }catch(e){}
  try{ if(hasTTS) speechSynthesis.cancel(); }catch(e){}
  markReps();
}
function playOnce(text, done){
  const clip = AUDIO[stripTags(text)];
  if(clip){
    try{
      if(hasTTS) speechSynthesis.cancel();
      if(player){ player.onended=null; player.pause(); }
      player = new Audio("a/"+clip);
      player.onended = done;
      player.play().catch(()=>ttsOnce(text, done));
      return;
    }catch(e){}
  }
  ttsOnce(text, done);
}
function ttsOnce(text, done){
  if(!hasTTS){ done && done(); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(stripTags(text));
    u.lang = "en-GB"; u.rate = 0.9;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang));
    if(v) u.voice = v;
    u.onend = done;
    speechSynthesis.speak(u);
  }catch(e){ done && done(); }
}
function playRepeat(text, n, toggle){
  const same = rep && rep.text===text && rep.n===n;
  stopAll();
  if(toggle && same) return;
  const r = {text, n, i:1};
  rep = r; markReps();
  const next = () => {
    if(rep!==r) return;
    if(r.i>=n){ rep=null; markReps(); return; }
    r.timer = setTimeout(()=>{ if(rep!==r) return; r.i++; markReps(); playOnce(text, next); }, GAP);
  };
  playOnce(text, next);
}
function say(text){ playRepeat(text, 1, false); }
function markReps(){
  document.querySelectorAll(".rep").forEach(el=>{
    const active = rep && el.dataset.text===rep.text;
    el.querySelectorAll("[data-play]").forEach(btn=>{
      const n = +btn.dataset.play;
      const on = !!(active && rep.n===n);
      btn.classList.toggle("on", on);
      if(n>1) btn.textContent = on ? `${rep.i}/${n}` : `${n}×`;
    });
  });
}
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const spk = raw => { const text = stripTags(raw); return `<span class="rep" data-text="${esc(text)}"><button class="spk" data-play="1" aria-label="Play once: ${esc(text)}">${ICON_SPK}</button><span class="reps">${[3,6,9,18].map(n=>`<button class="rx" data-play="${n}" aria-label="Play ${n} times">${n}×</button>`).join("")}</span></span>`; };
const initials = n => n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();

function shuffled(tid, qi, arr){
  const key = tid+":"+qi;
  if(!S.order[key]){
    const idx = arr.map((_,i)=>i);
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
    S.order[key]=idx;
  }
  return S.order[key];
}

function renderTopic(){
  const t = TOPICS[S.t];
  let h = bar() + `<div class="thead">

  <nav class="steps" aria-label="Steps">${STEPS.map((s,i)=>`<button data-step="${i}" ${i===S.step?'aria-current="step"':''}><span class="n">${i+1}</span>${s[0]}<small>${s[1]}</small></button>`).join("")}</nav>
  <div class="panel">`;
  h += [stepWords, stepChat, stepQuiz, stepSpeak][S.step](t);
  h += `</div><div class="stepnav">
    <button class="btn" id="prev" ${S.step===0?'disabled':''}>← ${S.step>0?STEPS[S.step-1][0]:'Back'}</button>
    ${S.step<3?`<button class="btn primary" id="next">${STEPS[S.step+1][0]} →</button>`:`<button class="btn primary" id="nextTopic">${S.t<TOPICS.length-1?'Next topic →':'All topics'}</button>`}
  </div>`;
  app.innerHTML = h;
}

function stepWords(t){
  return `<div class="legend"><span><b>Listen and repeat.</b> Play once, or choose 3×, 6×, 9× or 18× to hear it again and again. Tap the same button to stop.</span><span class="bn bn-only">একবার শুনতে প্লে চাপো, বারবার শুনতে 3× / 6× / 9× / 18× চাপো। থামাতে আবার চাপো।</span></div>
  <div class="section-title">Key words <span class="bn bn-only">গুরুত্বপূর্ণ শব্দ</span></div>
  <div class="words">${t.words.map(w=>`<div class="word"><div><b>${w[0]}</b><span class="bn bn-only">${w[1]}</span></div>${spk(w[0])}</div>`).join("")}</div>
  <div class="section-title">Sentence patterns <span class="bn bn-only">বাক্যের কাঠামো</span></div>
  <div class="patterns">${t.patterns.map(p=>`<div class="pattern"><div class="en">${p[0]}</div><div class="bn bn-only">${p[1]}</div><div class="pr">${spk(p[0])}</div></div>`).join("")}</div>
  <div class="section-title">Common mistake <span class="bn bn-only">সাধারণ ভুল</span></div>
  <div class="mistake"><div class="w"><small>Don't say</small><span>${t.mistake[0]}</span></div><div class="r"><small>Say</small>${t.mistake[1]}<div class="bctl">${spk(t.mistake[1])}</div></div><p class="bn bn-only">${t.mistake[2]}</p></div>`;
}

function stepChat(t){
  const B = t.people[1];
  const total = t.lines.length;
  let bubbles = t.lines.slice(0,S.shown).map((l,i)=>{
    const side = l[0]===0?"a":"b";
    const name = t.people[l[0]];
    const hideEn = S.roleplay && l[0]===1 && !S.revealed.has(i);
    const body = hideEn
      ? `<span class="rp-prompt">Your turn. Say this in English:</span><span class="bn" style="opacity:1">${l[2]}</span><button class="reveal" data-reveal="${i}">Show the English</button>`
      : `<span class="en">${l[1]}</span><span class="bn bn-only">${l[2]}</span><div class="bctl">${spk(l[1])}</div>`;
    return `<div class="msg ${side}"><div class="av" aria-hidden="true">${initials(name)}</div><div class="bubble"><span class="who">${name}</span>${body}</div></div>`;
  }).join("");
  return `<div class="scenebox"><span class="tag">Scene</span><div><p>${t.scene[0]}</p><p class="bn bn-only">${t.scene[1]}</p></div></div>
  <div class="modes" role="group" aria-label="Mode">
    <button class="chip" data-mode="read" aria-pressed="${!S.roleplay}">Read &amp; listen</button>
    <button class="chip" data-mode="rp" aria-pressed="${S.roleplay}">Role-play: you are ${B}</button>
  </div>
  <div class="chat" aria-live="polite">${bubbles}</div>
  <div class="chatctl">
    <button class="btn primary" id="nextLine" ${S.shown>=total?'disabled':''}>Next line</button>
    <button class="btn" id="allLines" ${S.shown>=total?'disabled':''}>Show all</button>
    <button class="btn" id="restart">Start again</button>
    <span class="counter">${S.shown} / ${total}</span>
  </div>`;
}

function stepQuiz(t){
  const ans = S.answers[t.id] || {};
  let correct = 0, count = 0;
  const qs = t.quiz.map((q,qi)=>{
    const ord = shuffled(t.id, qi, q[1]);
    const picked = ans[qi];
    if(picked!==undefined){ count++; if(picked===0) correct++; }
    return `<div class="q"><div class="said"><div class="av" aria-hidden="true">${initials(t.people[0])}</div><div><small>${t.people[0]} says:</small><span class="en">“${q[0]}”</span></div>${spk(q[0])}</div>
      <div class="opts">${ord.map(oi=>{
        let cls="", mark="";
        if(picked!==undefined){
          if(oi===0){cls="right";mark="Correct";}
          else if(oi===picked){cls="wrong";mark="Not quite";}
        }
        return `<button class="opt ${cls}" data-q="${qi}" data-o="${oi}" ${picked!==undefined?'disabled':''}><span>${q[1][oi]}</span><span class="mark">${mark}</span></button>`;
      }).join("")}</div></div>`;
  }).join("");
  const done = count===t.quiz.length;
  return `<div class="section-title">Choose the best reply <span class="bn bn-only">সঠিক উত্তরটি বেছে নাও</span></div>${qs}
  <div class="chatctl"><span class="score">${done?`You got ${correct} of ${t.quiz.length}`:`${count} of ${t.quiz.length} answered`}</span>${done?`<button class="btn" id="retry">Try again</button>`:''}</div>`;
}

function stepSpeak(t){
  const sp = t.speak.map((s,i)=>{
    const tm = S.timers[t.id+i];
    const left = tm ? tm.left : 45;
    return `<div class="sp"><div class="qq">${s[0]}</div><div class="bn bn-only">${s[1]}</div>
      <div class="helpers">${s[3].map(x=>`<span>${x}</span>`).join("")}</div>
      <div class="ctl"><button class="btn primary" data-timer="${i}">${tm&&tm.running?'Stop':'Speak for 45 s'}</button><span class="timer ${left<=10?'low':''}" id="tm${i}">${left}</span>
      <button class="btn" data-sample="${i}">${S.revealed.has('s'+i)?'Hide':'Show'} sample answer</button></div>
      ${S.revealed.has('s'+i)?`<div class="sample"><div><small>Sample answer</small>${s[2]}</div>${spk(s[2])}</div>`:''}
    </div>`;
  }).join("");
  const isDone = S.done.has(t.id);
  return `<div class="section-title">Your turn to speak <span class="bn bn-only">এবার তুমি বলো</span></div>
  <p style="margin:0;color:var(--muted)">Say your answer out loud. Use the helper phrases, then compare with the sample.</p>${sp}
  <div class="finish"><p>${isDone?'<b>Topic complete.</b> Come back any time to practise again.':'Finished speaking? Mark this topic as done to track your progress.'}</p>
  <button class="btn ${isDone?'':'primary'}" id="markDone">${isDone?'Mark as not done':'Mark topic done'}</button></div>`;
}

function render(){ applyBn(); S.view==="home"?renderHome():renderTopic(); markReps(); tgBack(); }

/* ---------- Telegram Mini App ---------- */
const TG = (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined && Telegram.WebApp.platform !== "unknown") ? Telegram.WebApp : null;
function tgTheme(){
  if(!TG) return;
  document.documentElement.setAttribute("data-theme", TG.colorScheme === "dark" ? "dark" : "light");
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try{ TG.setHeaderColor(bg); TG.setBackgroundColor(bg); }catch(e){}
}
function tgBack(){
  if(!TG) return;
  try{ S.view==="topic" ? TG.BackButton.show() : TG.BackButton.hide(); }catch(e){}
}
if(TG){
  TG.ready(); TG.expand();
  tgTheme();
  TG.onEvent("themeChanged", tgTheme);
  TG.BackButton.onClick(()=>{ stopTimers(); S.view="home"; render(); window.scrollTo(0,0); });
}


function openTopic(i){ stopTimers(); S.view="topic"; S.t=i; S.step=0; resetChat(); render(); window.scrollTo(0,0); }
function resetChat(){ S.shown=1; S.revealed=new Set(); }
function setStep(n){ stopTimers(); S.step=n; S.revealed=new Set(); S.shown=1; render(); window.scrollTo(0,0); }
function stopTimers(){ stopAll(); Object.values(S.timers).forEach(tm=>clearInterval(tm.id)); S.timers={}; }

app.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.play){ playRepeat(b.closest('.rep').dataset.text, +b.dataset.play, true); return; }
  if(b.id==="bnToggle"){ S.showBn=!S.showBn; store.set("bn",S.showBn); b.setAttribute("aria-pressed",S.showBn); applyBn(); return; }
  if(b.dataset.open!==undefined){ openTopic(+b.dataset.open); return; }
  if(b.id==="back"){ stopTimers(); S.view="home"; render(); window.scrollTo(0,0); return; }
  if(b.dataset.step!==undefined){ setStep(+b.dataset.step); return; }
  if(b.id==="prev"){ if(S.step>0) setStep(S.step-1); return; }
  if(b.id==="next"){ setStep(S.step+1); return; }
  if(b.id==="nextTopic"){ if(S.t<TOPICS.length-1) openTopic(S.t+1); else { S.view="home"; render(); } return; }
  const t = TOPICS[S.t];
  if(b.dataset.mode){ S.roleplay = b.dataset.mode==="rp"; resetChat(); render(); if(S.roleplay) say(t.lines[0][1]); return; }
  if(b.id==="nextLine"){ S.shown=Math.min(S.shown+1,t.lines.length); render(); const l=t.lines[S.shown-1]; if(!(S.roleplay&&l[0]===1)) say(l[1]); scrollChat(); return; }
  if(b.id==="allLines"){ S.shown=t.lines.length; render(); return; }
  if(b.id==="restart"){ resetChat(); render(); return; }
  if(b.dataset.reveal!==undefined){ const i=+b.dataset.reveal; S.revealed.add(i); render(); say(t.lines[i][1]); return; }
  if(b.dataset.q!==undefined){ const a=S.answers[t.id]||(S.answers[t.id]={}); a[+b.dataset.q]=+b.dataset.o; render(); return; }
  if(b.id==="retry"){ delete S.answers[t.id]; t.quiz.forEach((_,qi)=>delete S.order[t.id+":"+qi]); render(); return; }
  if(b.dataset.sample!==undefined){ const k='s'+b.dataset.sample; S.revealed.has(k)?S.revealed.delete(k):S.revealed.add(k); render(); return; }
  if(b.dataset.timer!==undefined){ toggleTimer(t, +b.dataset.timer); return; }
  if(b.id==="markDone"){ S.done.has(t.id)?S.done.delete(t.id):S.done.add(t.id); store.set("done",[...S.done]); render(); return; }
});

function scrollChat(){ const c=app.querySelector(".chat .msg:last-child"); if(c) c.scrollIntoView({block:"nearest",behavior:"smooth"}); }

function toggleTimer(t,i){
  const key=t.id+i; const tm=S.timers[key];
  if(tm && tm.running){ clearInterval(tm.id); tm.running=false; render(); return; }
  const st = {left:45, running:true};
  S.timers[key]=st;
  st.id=setInterval(()=>{
    st.left--; const el=document.getElementById("tm"+i);
    if(el){ el.textContent=st.left; el.classList.toggle("low", st.left<=10); }
    if(st.left<=0){ clearInterval(st.id); st.running=false; st.left=0; render(); }
  },1000);
  render();
}

if(hasTTS){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
render();
</script>

</body></html>
